name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # SDK 10 for the RID-specific tool packaging; the 8.0 runtime runs the net8.0 tests.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build (warnings are errors)
        run: dotnet build BcDb.sln -c Release

      - name: Test (hermetic — unit tests + full pipeline against fixtures/typeprobe.bak)
        run: dotnet test BcDb.sln -c Release --no-build --logger "console;verbosity=normal" -- RunConfiguration.TreatNoTestsAsError=true

      - name: Assert the BC full-file tests were SKIPPED, not silently passed
        # The ~900 MB BC demo backups cannot exist in CI. The suite must report those
        # tests as skipped; a run with zero skips here means the guard rotted and CI
        # is green while testing nothing.
        run: |
          dotnet test BcDb.sln -c Release --no-build 2>&1 | tee /tmp/testlog
          grep -E 'Skipped:\s*[1-9]' /tmp/testlog || {
            echo "expected the BC demo-backup tests to report as SKIPPED in CI" >&2
            exit 1
          }

      - name: Smoke-run the CLI against the committed fixture backup
        run: |
          out=$(dotnet run --project src/BcDb.Cli -c Release --no-build -- tables fixtures/typeprobe.bak)
          echo "$out"
          echo "$out" | grep -q 'probe_dense' || { echo 'CLI table listing missing probe_dense' >&2; exit 1; }
          # --version answers without a file argument and identifies this as the JIT build.
          dotnet run --project src/BcDb.Cli -c Release --no-build -- --version | grep -q 'jit'

      - name: Smoke-run the CLI against the committed fixture bacpac
        # Same database, exported by sqlpackage: the two containers must answer alike.
        run: |
          out=$(dotnet run --project src/BcDb.Cli -c Release --no-build -- tables fixtures/typeprobe.bacpac)
          echo "$out"
          echo "$out" | grep -q 'probe_dense' || { echo 'bacpac table listing missing probe_dense' >&2; exit 1; }
          bak=$(dotnet run --project src/BcDb.Cli -c Release --no-build -- read fixtures/typeprobe.bak --table probe_dense --select 'id,grp,note' | sort)
          bp=$(dotnet run --project src/BcDb.Cli -c Release --no-build -- read fixtures/typeprobe.bacpac --table probe_dense --select 'id,grp,note' | sort)
          [ "$bak" = "$bp" ] || { echo 'bak and bacpac reads of probe_dense differ' >&2; exit 1; }

      # Last, because packing rewrites bin/Release/net8.0/: `dotnet pack -r <rid>` replaces
      # the RID-agnostic apphost, and a `dotnet run --no-build` after it fails with "An
      # error occurred trying to start process .../bcdb". The tool packaging is release-only,
      # but a broken csproj should fail here rather than at tag time.
      - name: Pack the tool packages
        run: |
          dotnet pack src/BcDb.Cli/BcDb.Cli.csproj -c Release -o nuget
          dotnet pack src/BcDb.Cli/BcDb.Cli.csproj -c Release -r any -p:PublishAot=false -o nuget
          dotnet pack src/BcDb.Core/BcDb.Core.csproj -c Release -o nuget
          ls nuget
