name: Release

# Native AOT binaries, one per platform. A one-shot `bcdb read` spends most of its wall
# clock starting the runtime and JIT-compiling code it runs once: on the BC 28.1 demo
# backup a cold single-table read is 174 ms from `dotnet build` and 57 ms from this, on a
# 29 ms vs 4 ms startup floor. Native AOT cannot cross-compile between operating systems
# ("Cross-OS native compilation is not supported"), so each target is built on its own
# runner rather than fanned out from one.

on:
  push:
    tags: ['v*']
  workflow_dispatch:        # build the matrix without publishing, to check the legs still work

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false      # one platform's toolchain breaking must not withhold the others
      matrix:
        include:
          - { os: ubuntu-latest,    rid: linux-x64,   name: bcdb-linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, name: bcdb-linux-arm64 }
          - { os: windows-latest,   rid: win-x64,     name: bcdb-win-x64,   ext: .exe }
          # macos-13 was fully retired in December 2025 and a retired label queues forever
          # instead of failing. macos-15-intel is the supported x86_64 macOS runner and is
          # available until August 2027; GitHub drops Intel macOS entirely in autumn 2027,
          # at which point this leg has to go or be cross-built from an arm64 runner.
          - { os: macos-15-intel,   rid: osx-x64,     name: bcdb-osx-x64 }
          - { os: macos-latest,     rid: osx-arm64,   name: bcdb-osx-arm64 }
    runs-on: ${{ matrix.os }}
    # Only the Windows leg signs, but `environment` is per job and this job is the matrix,
    # so all five legs pass through it. Keep `code-signing` free of protection rules: a
    # required reviewer here would gate every platform build, not just the signed one.
    environment: code-signing
    permissions:
      contents: read
      id-token: write         # build-provenance attestation, and the Entra ID token exchange
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # SDK 10 packs the RID-specific tool packages; the 8.0 runtime runs the net8.0 tests.
          dotnet-version: |
            8.0.x
            10.0.x

      # A tag is the source of truth for a release build's version, and it must agree with
      # the csproj: a tag that says v0.2.0 while the assembly says 0.1.0 produces binaries
      # that misreport themselves through `bcdb --version`, which is the one thing a bug
      # report has to be able to trust. Disagreement fails the build rather than shipping.
      - name: Resolve and check the version
        id: ver
        shell: bash
        run: |
          csproj=$(sed -n 's|.*<Version>\([^<]*\)</Version>.*|\1|p' src/BcDb.Cli/BcDb.Cli.csproj | head -1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ "$tag" != "$csproj" ]]; then
              echo "tag v$tag disagrees with <Version>$csproj</Version> in BcDb.Cli.csproj" >&2
              exit 1
            fi
            echo "version=$tag" >> "$GITHUB_OUTPUT"
          else
            # A workflow_dispatch run rehearses the matrix and is never published; it is
            # versioned so that a stray binary from one cannot be mistaken for a release.
            echo "version=${csproj}-dispatch.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the native toolchain (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # The hermetic suite runs against the committed fixtures on every platform, so a
      # binary is only published if the reader actually decodes correctly there.
      - name: Test
        run: dotnet test BcDb.sln -c Release --logger "console;verbosity=minimal" -- RunConfiguration.TreatNoTestsAsError=true

      - name: Publish native
        run: dotnet publish src/BcDb.Cli/BcDb.Cli.csproj -c Release -r ${{ matrix.rid }} -o out -p:Version=${{ steps.ver.outputs.version }}

      # The same Native AOT binary, wrapped as a .NET tool package for this RID. Each one
      # has to be packed on its matching OS, which is exactly what this matrix already is.
      # This runs before signing, not after: `dotnet pack -r <rid>` re-runs the AOT publish
      # and overwrites the binary, so a signature applied first is discarded. Measured both
      # ways, with and without --no-build — the packed binary came back with its original
      # hash every time. So the package's own copy is signed afterwards and swapped back in.
      - name: Pack the RID-specific tool package
        shell: bash
        run: dotnet pack src/BcDb.Cli/BcDb.Cli.csproj -c Release -r ${{ matrix.rid }} -o nuget -p:Version=${{ steps.ver.outputs.version }}

      # --- Authenticode, Windows only -------------------------------------------------
      # Unsigned, `bcdb.exe` trips SmartScreen on download and Smart App Control can block
      # it outright. Both copies are signed in one pass: the binary that becomes the release
      # asset, and the separate copy inside the tool package.
      - name: Take the tool package's own copy of the binary out for signing
        if: matrix.rid == 'win-x64'
        shell: bash
        run: |
          pkg=$(ls nuget/bcdb.win-x64.*.nupkg)
          python .github/scripts/nupkg_swap.py extract "$pkg" pkgsign

      - name: Fetch a federated OIDC token for the Entra ID exchange
        if: matrix.rid == 'win-x64'
        # azure/artifact-signing-action hands azure-tenant-id/azure-client-id to
        # Azure.Identity's WorkloadIdentityCredential, which also requires
        # AZURE_FEDERATED_TOKEN_FILE — a file holding a GitHub OIDC token with audience
        # api://AzureADTokenExchange. Nothing populates that file on its own; without this
        # step the credential fails with "workload options are not fully configured".
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), path = require('path');
            const token = await core.getIDToken('api://AzureADTokenExchange');
            const file = path.join(process.env.RUNNER_TEMP, 'azure-federated-token.txt');
            fs.writeFileSync(file, token);
            core.exportVariable('AZURE_FEDERATED_TOKEN_FILE', file);

      - name: List both copies for signing
        if: matrix.rid == 'win-x64'
        shell: pwsh
        # Written from PowerShell, not bash: Git Bash reports $(pwd) as /d/a/..., which the
        # signing action's Resolve-Path reads as a relative path and appends to the
        # workspace, looking for D:\a\...\d\a\...\out\bcdb.exe. github.workspace is
        # already a native Windows path. The existence check is here so a missing file is
        # named directly instead of surfacing as a confusing Resolve-Path error.
        run: |
          $files = @(
            "${{ github.workspace }}\out\bcdb.exe",
            "${{ github.workspace }}\pkgsign\bcdb.exe"
          )
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { throw "expected to sign $f but it does not exist" }
          }
          $files | Set-Content catalog.txt
          Get-Content catalog.txt

      - name: Sign with Azure Artifact Signing
        if: matrix.rid == 'win-x64'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.SIGNING_CERT_PROFILE_NAME }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          exclude-workload-identity-credential: false
          files-catalog: ${{ github.workspace }}\catalog.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify both copies are actually signed
        if: matrix.rid == 'win-x64'
        shell: pwsh
        # Fail here, on the machine that just signed, rather than shipping an unsigned
        # binary that looks like a successful release.
        run: |
          foreach ($f in @('out/bcdb.exe', 'pkgsign/bcdb.exe')) {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$f -> $($sig.Status)  $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$f is not validly signed: $($sig.Status)" }
          }

      - name: Put the signed copy back into the tool package
        if: matrix.rid == 'win-x64'
        shell: bash
        run: |
          pkg=$(ls nuget/bcdb.win-x64.*.nupkg)
          python .github/scripts/nupkg_swap.py replace "$pkg" pkgsign/bcdb.exe

      # --- end Authenticode -------------------------------------------------------------

      # Prove the published binary runs on this platform and decodes the committed
      # backup — a binary that only links is not evidence of anything. On Windows this
      # now also proves signing did not damage the executable.
      - name: Smoke-run the published binary
        shell: bash
        run: |
          out/bcdb${{ matrix.ext }} tables fixtures/typeprobe.bak | grep -q probe_dense
          out/bcdb${{ matrix.ext }} read fixtures/typeprobe.bak --table probe_dense --select id,grp,note | head -3
          # The binary must report the version this run built and know it is the AOT build;
          # a release that ships binaries claiming to be the JIT build has lost the plot.
          v=$(out/bcdb${{ matrix.ext }} --version)
          echo "$v"
          echo "$v" | grep -q '${{ steps.ver.outputs.version }}'
          echo "$v" | grep -q 'native aot'

      - name: Name the artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "out/bcdb${{ matrix.ext }}" "dist/${{ matrix.name }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-${{ matrix.rid }}
          path: nuget/*.nupkg

      # Provenance: signed, verifiable evidence of which workflow, commit and runner
      # produced this exact binary, checkable with `gh attestation verify`. Free and
      # keyless via OIDC — it is not Authenticode or Apple notarization and does not
      # quiet SmartScreen or Gatekeeper, which need purchased signing identities.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  # The top-level pointer package names the RID packages the CLI can choose between, and
  # `any` is the CoreCLR fallback for a platform with no AOT build. Neither is
  # platform-specific, so both are packed once rather than per matrix leg.
  pack-portable:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve the version
        id: ver
        shell: bash
        run: |
          csproj=$(sed -n 's|.*<Version>\([^<]*\)</Version>.*|\1|p' src/BcDb.Cli/BcDb.Cli.csproj | head -1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            [[ "$tag" == "$csproj" ]] || { echo "tag v$tag disagrees with <Version>$csproj</Version>" >&2; exit 1; }
            echo "version=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "version=${csproj}-dispatch.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack the pointer package and the portable fallback
        run: |
          dotnet pack src/BcDb.Cli/BcDb.Cli.csproj -c Release -o nuget -p:Version=${{ steps.ver.outputs.version }}
          dotnet pack src/BcDb.Cli/BcDb.Cli.csproj -c Release -r any -p:PublishAot=false -o nuget -p:Version=${{ steps.ver.outputs.version }}
          dotnet pack src/BcDb.Core/BcDb.Core.csproj -c Release -o nuget -p:Version=${{ steps.ver.outputs.version }}
          ls -la nuget

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-portable
          path: nuget/*.*nupkg

  # The GitHub release: reversible. A bad tag can be deleted and re-cut, so this needs no
  # approval and does not wait on the nuget.org publish.
  release:
    needs: [build, pack-portable]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write         # create the release and upload assets
    steps:
      - uses: actions/download-artifact@v4
        with: { path: staging }

      - name: Collect the binaries and checksum them
        # The .nupkg files are the other job's business; only binaries are release assets.
        run: |
          mkdir -p dist
          find staging -type f \( -name '*.nupkg' -o -name '*.snupkg' \) -delete
          find staging -type f -exec cp {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Self-contained native binaries — no .NET runtime required. Download the one
            for your platform, make it executable, and run it. Or install it as a .NET
            tool, which resolves to the same native binary for your platform:

                dotnet tool install -g bcdb

            Built with Native AOT. On the BC 28.1 demo backup (936 MB, NVMe), a one-shot
            single-table read is ~57 ms cold and ~27 ms warm; in `bcdb serve`, the first
            answer lands in ~26 ms and later reads in 1-3 ms.

            Verify a download against `SHA256SUMS`, and verify how it was built with:

                gh attestation verify <file> --repo StefanMaron/BusinessCentral.DbReader

            These binaries are not yet Authenticode-signed or Apple-notarized, so Windows
            SmartScreen will warn and macOS Gatekeeper will quarantine a browser download
            (`xattr -d com.apple.quarantine <file>` clears it).

  # The nuget.org publish: irreversible. nuget.org has no delete, only unlist, so this is
  # the one step in the pipeline that cannot be walked back — it waits on the `nuget`
  # environment's required reviewer. Trusted Publishing is scoped to this workflow file and
  # this environment, so the OIDC token can only be issued to this job and no other.
  publish-nuget:
    needs: [build, pack-portable]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write         # OIDC, exchanged for a short-lived nuget.org API key
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/download-artifact@v4
        with: { path: staging }

      - name: Collect the packages
        run: |
          mkdir -p nuget
          find staging -type f \( -name '*.nupkg' -o -name '*.snupkg' \) -exec mv {} nuget/ \;
          ls -la nuget

      # The temporary API key is valid for one hour, so it is requested immediately before
      # the push rather than at the top of the job.
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: StefanMaron          # the nuget.org profile name, not an email address

      - name: Push to nuget.org
        # Order matters: the CLI resolves a tool install through the pointer package, which
        # names RID packages that must already exist. Everything else goes first, the
        # pointer package last. --skip-duplicate makes a re-run of a tag safe.
        run: |
          set -euo pipefail
          pointer="nuget/bcdb.${GITHUB_REF_NAME#v}.nupkg"
          for f in nuget/*.nupkg; do
            if [ "$f" != "$pointer" ]; then
              echo "push $f"
              dotnet nuget push "$f" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
                --source https://api.nuget.org/v3/index.json --skip-duplicate
            fi
          done
          echo "push $pointer (last)"
          dotnet nuget push "$pointer" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
